name: Importar torneios

# Uma vez por dia: acha Showdowns e Regionais novos na UVS, busca rodadas novas dos eventos acompanhados,
# recalcula as estatísticas e traz do TopDeck.gg as decklists dos eventos grandes.
# Rodadas já completas e gravadas são puladas, então o job leva poucos minutos.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      topdeck:
        description: "Opcional, para o TopDeck: códigos de torneios para importar, ou --find <nome> para procurar"
        required: false
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Opcional: sem a chave, o passo do TopDeck só avisa e segue.
      TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
    steps:
      - name: Sem banco configurado, nada a fazer
        if: env.DATABASE_URL == ''
        run: echo "Defina o segredo DATABASE_URL (Supabase) para ativar a importação." && exit 0
      - uses: actions/checkout@v4
        if: env.DATABASE_URL != ''
      - uses: pnpm/action-setup@v4
        if: env.DATABASE_URL != ''
      - uses: actions/setup-node@v4
        if: env.DATABASE_URL != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.DATABASE_URL != ''
      - run: pnpm db:migrate
        if: env.DATABASE_URL != ''
      - name: Acompanha os Showdowns e Regionais novos
        run: pnpm discover
        if: env.DATABASE_URL != ''
      # Eventos "não listados" na UVS não aparecem na busca por nome; entram por tracked-events.json.
      - name: Acompanha os eventos cadastrados à mão
        run: pnpm track seed
        if: env.DATABASE_URL != ''
      - run: pnpm ingest
        if: env.DATABASE_URL != ''
      - name: Decklists e eventos grandes do TopDeck.gg (desde o lançamento, só os novos)
        # Com o campo "topdeck" preenchido na execução manual, faz só o que ele pede.
        # O valor vai por variável de ambiente, sem passar pelo shell como código.
        run: pnpm topdeck $TOPDECK_ARGS
        env:
          TOPDECK_ARGS: ${{ inputs.topdeck }}
        if: env.DATABASE_URL != ''
        # Uma falha do TopDeck não pode travar o resto da importação.
        continue-on-error: true
      - name: Preenche o nick dos eventos importados antes de existir nick (só os que faltam)
        run: pnpm nicks
        if: env.DATABASE_URL != ''
      - name: Liga o ao vivo dos eventos que começam em até 36 h
        run: pnpm live --arm
        if: env.DATABASE_URL != ''
